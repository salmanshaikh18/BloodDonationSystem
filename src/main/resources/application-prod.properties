# ---------------------------------------------------------------
# Live site on Vercel, using the Neon PostgreSQL database.
# Vercel's Neon integration provides the PG* environment variables,
# so no password is ever written in the code.
# ---------------------------------------------------------------

spring.datasource.url=jdbc:postgresql://${PGHOST_UNPOOLED:${PGHOST}}/${PGDATABASE}?sslmode=${PGSSLMODE:require}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# The free database allows only a few connections
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# Vercel sits in front of the app: trust its X-Forwarded-* headers so links use https
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true

# Browsers may cache CSS, JavaScript and images for a year
# (their file names change whenever their content changes)
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

# Set APP_SAMPLE_DATA=true in Vercel to add made-up donors to an empty database
app.sample-data.enabled=${APP_SAMPLE_DATA:false}
