# ---------------------------------------------------------------
# Settings shared by every environment.
# application-local.properties -> your laptop (H2 database)
# application-prod.properties  -> the live site (Neon PostgreSQL)
# ---------------------------------------------------------------

spring.application.name=blood-donation-system

# Use the "local" settings unless another profile is chosen.
# The Docker image chooses "prod" for the live site.
spring.profiles.default=local

# ---------- Web server ----------
# Vercel tells the app which port to listen on through the PORT variable.
server.port=${PORT:8080}
server.compression.enabled=true
server.servlet.session.tracking-modes=cookie
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never

# ---------- JSP views ----------
# A controller returning "donors/list" shows /WEB-INF/jsp/donors/list.jsp
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# ---------- CSS, JavaScript and images ----------
# Adds a content hash to file names (app-3f2a....css) so browsers can cache them safely.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# ---------- Database ----------
# Flyway creates the tables from src/main/resources/db/migration.
# Hibernate only checks that the Java entities match those tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------- Sample data ----------
# Adds made-up donors to an empty database (see SampleDataLoader).
app.sample-data.enabled=false
