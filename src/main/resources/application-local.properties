# ---------------------------------------------------------------
# Your laptop: an H2 database saved in the ./data folder.
# Nothing to install. PostgreSQL mode keeps the SQL the same as the live site.
# ---------------------------------------------------------------

spring.datasource.url=jdbc:h2:file:./data/blood-donation;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# See the tables at http://localhost:8080/h2-console
# (JDBC URL: the one above, User Name: sa, no password)
spring.h2.console.enabled=true

# Fill an empty database with made-up donors so the pages have something to show
app.sample-data.enabled=true

# Always serve the newest CSS and JavaScript while developing
spring.web.resources.chain.cache=false
spring.web.resources.cache.period=0
